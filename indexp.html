<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>пароль</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #8b1e3f;
    font-family: Arial, sans-serif;
    color: white;
}

.box {
    text-align: center;
}

input {
    padding: 12px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    outline: none;
    margin-top: 10px;
    text-align: center;
}

button {
    margin-top: 12px;
    padding: 10px 20px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: white;
    color: #8b1e3f;
    font-weight: bold;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.05);
}

.error {
    margin-top: 10px;
    color: #ffb3b3;
}
</style>
</head>

<body>

<div class="box">
    <h2>введи пароль</h2>
    <input type="password" id="pass" placeholder="">
    <br>
    <button onclick="check()">войти</button>

    <div class="error" id="error"></div>
</div>


<audio id="wrongSound" src="mmm/mimo3.mp3"></audio>

<script>
function check() {
    let password = document.getElementById("pass").value;
    let sound = document.getElementById("wrongSound");

    if (password === "Наиля") {
        window.location.href = "index.html";
    } else {
        document.getElementById("error").innerText = "почтигой почти";

        
        sound.currentTime = 0;
        sound.play();
    }
}
</script>

</body>
</html>
